name: Build bpftrace for ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
 
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone bpftrace source
        run: |
          git clone --recursive https://github.com/bpftrace/bpftrace.git bpftrace-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            bison \
            flex \
            pkg-config \
            zlib1g-dev \
            libelf-dev \
            llvm-dev \
            libclang-dev \
            clang
          

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            ../bpftrace-src

      - name: Build with Ninja
        run: |
          cd build
          ninja -j$(nproc) src/bpftrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpftrace-arm64
          path: build/src/bpftrace
