name: Build bpftrace for ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Multi-arch and Install Dependencies
      run: |
        # 1. Thêm kiến trúc arm64
        sudo dpkg --add-architecture arm64
        
        # 2. Cấu hình lại sources.list để tách riêng repo của amd64 và arm64
        sudo sed -i 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list
        
        sudo apt-get update
        
        # 3. Cài đặt các công cụ build cơ bản trên host (amd64)
        sudo apt-get install -y \
          cmake \
          ninja-build \
          g++-aarch64-linux-gnu \
          gcc-aarch64-linux-gnu \
          pkg-config \
          flex \
          bison \
          libcereal-dev
          
        # 4. Cài đặt các thư viện phụ thuộc (dành cho arm64)
        # Lưu ý: Cần thêm llvm, clang và bcc vì bpftrace yêu cầu
        sudo apt-get install -y \
          zlib1g-dev:arm64 \
          libelf-dev:arm64 \
          libbpf-dev:arm64 \
          libbcc-dev:arm64 \
          llvm-dev:arm64 \
          libclang-dev:arm64

    - name: Create Toolchain File
      run: |
        cat << 'EOF' > toolchain-aarch64.cmake
        set(CMAKE_SYSTEM_NAME Linux)
        set(CMAKE_SYSTEM_PROCESSOR aarch64)

        set(CMAKE_C_COMPILER /usr/bin/aarch64-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER /usr/bin/aarch64-linux-gnu-g++)

        # Định tuyến để CMake ưu tiên tìm thư viện ARM64
        set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
        
        set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
        set(ENABLE_MAN OFF CACHE BOOL "" FORCE)
        EOF

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=../toolchain-aarch64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          ..

    - name: Build with Ninja
      run: |
        cd build
        ninja -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bpftrace-arm64
        path: build/src/bpftrace # Kiểm tra lại output directory của bạn nếu cần
